apiVersion: apps/v1
kind: Deployment
metadata:
  name: brezel-spa
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brezel-spa
  template:
    metadata:
      labels:
        app: brezel-spa
        configVersion: {{ include "brezel.spaConfigVersion" . }}
    spec:
      containers:
      - name: brezel-spa
        image: {{ .Values.spa_image }}
        imagePullPolicy: Always
        workingDir: /usr/share/nginx/html
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: {{ .Values.spa_resources.limits.cpu }}
            memory: {{ .Values.spa_resources.limits.memory }}
          requests:
            cpu: {{ .Values.spa_resources.requests.cpu }}
            memory: {{ .Values.spa_resources.requests.memory }}
        volumeMounts:
        - name: config-volume
          mountPath: /usr/share/nginx/html/config.js
          subPath: config.js
          readOnly: true
      imagePullSecrets:
      - name: {{ include "brezel.imagePullSecretName" . }}
      volumes:
      - name: config-volume
        configMap:
          name: brezel-spa
