{{- if .Values.gateway.api.listener_set.spa }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: brezel-spa
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ .Values.gateway.api.name | quote }}
  hostnames: {{ toJson .Values.hostnames }}
  rules:
    - backendRefs: [{group: "", kind: Service, name: brezel-spa, port: 80, weight: 1}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Strict-Transport-Security, value: "max-age=15724800; includeSubDomains"}
      timeouts: {request: 0s, backendRequest: 0s}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: brezel-spa-http
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.api.listener_set.gateway_name | quote }}
      namespace: {{ .Values.gateway.api.listener_set.gateway_namespace | quote }}
      sectionName: http
  hostnames: {{ toJson .Values.hostnames }}
  rules:
    - backendRefs: [{group: "", kind: Service, name: brezel-spa, port: 80, weight: 1}]
      timeouts: {request: 0s, backendRequest: 0s}
---
{{- end }}
{{- if .Values.gateway.api.listener_set.brotcast }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: brotcast
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ .Values.gateway.api.name | quote }}
      sectionName: brotcast
  hostnames: [{{ .Values.brotcast_hostname | quote }}]
  rules:
    - backendRefs:
        - {group: "", kind: Service, name: brotcast, port: {{ .Values.brotcast_server_port }}, weight: 1}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Strict-Transport-Security, value: "max-age=15724800; includeSubDomains"}
      timeouts: {request: 0s, backendRequest: 0s}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: brotcast-http
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.api.listener_set.gateway_name | quote }}
      namespace: {{ .Values.gateway.api.listener_set.gateway_namespace | quote }}
      sectionName: http
  hostnames: [{{ .Values.brotcast_hostname | quote }}]
  rules:
    - backendRefs:
        - {group: "", kind: Service, name: brotcast, port: {{ .Values.brotcast_server_port }}, weight: 1}
      timeouts: {request: 0s, backendRequest: 0s}
{{- end }}
