apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: brezel-api-http
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.api.listener_set.gateway_name | quote }}
      namespace: {{ .Values.gateway.api.listener_set.gateway_namespace | quote }}
      sectionName: http
  hostnames: {{ toJson .Values.api_hostnames }}
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Forwarded, X-Forwarded-Host, X-Forwarded-Port, X-Forwarded-Prefix]
            set: [{name: X-Forwarded-Proto, value: http}]
      backendRefs:
        - group: ""
          kind: Service
          name: brezel
          port: {{ if eq .Values.api_runtime "fpm" }}8080{{ else }}80{{ end }}
          weight: {{ if (eq .Values.rollouts.api.type "canary") }}100{{ else }}1{{ end }}
        {{- if (eq .Values.rollouts.api.type "canary") }}
        - group: ""
          kind: Service
          name: brezel-canary
          port: {{ if eq .Values.api_runtime "fpm" }}8080{{ else }}80{{ end }}
          weight: 0
        {{- end }}
      timeouts: {request: 0s, backendRequest: 0s}
