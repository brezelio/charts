{{- if .Values.gateway.api.enabled }}
{{- if and (eq .Values.rollouts.api.type "canary") (not .Values.gateway.api.canary) }}
{{- fail "gateway.api canary requires explicit gateway.api.canary=true after plugin RBAC and Argo weight ownership are configured" }}
{{- end }}
{{- if and .Values.gateway.api.canary (ne .Values.rollouts.api.type "canary") }}
{{- fail "gateway.api.canary requires rollouts.api.type=canary" }}
{{- end }}
{{- if and (eq .Values.api_runtime "fpm") (not .Values.fpm_http.enabled) }}
{{- fail "gateway.api requires fpm_http.enabled for FPM backends" }}
{{- end }}
{{- if ne .Values.gateway.api.section_name "https" }}
{{- fail "gateway.api currently requires an HTTPS listener; HTTP origin trust must be configured separately" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: brezel-api
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: {{ if .Values.gateway.api.listener_set.enabled }}ListenerSet{{ else }}Gateway{{ end }}
      name: {{ required "gateway.api.name is required" .Values.gateway.api.name | quote }}
      namespace: {{ default .Values.namespace .Values.gateway.api.namespace | quote }}
      {{- if not .Values.gateway.api.listener_set.enabled }}
      sectionName: {{ .Values.gateway.api.section_name }}
      {{- end }}
  hostnames: {{ toJson .Values.api_hostnames }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=15724800; includeSubDomains"
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Forwarded, X-Forwarded-Host, X-Forwarded-Port, X-Forwarded-Prefix]
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - group: ""
          kind: Service
          name: brezel
          port: {{ if eq .Values.api_runtime "fpm" }}8080{{ else }}80{{ end }}
          weight: {{ if .Values.gateway.api.canary }}100{{ else }}1{{ end }}
        {{- if .Values.gateway.api.canary }}
        - group: ""
          kind: Service
          name: brezel-canary
          port: {{ if eq .Values.api_runtime "fpm" }}8080{{ else }}80{{ end }}
          weight: 0
        {{- end }}
      timeouts:
        request: 0s
        backendRequest: 0s
{{- end }}
