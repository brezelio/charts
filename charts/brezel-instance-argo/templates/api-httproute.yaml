apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: brezel-api
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ required "gateway.api.name is required" .Values.gateway.api.name | quote }}
      namespace: {{ default .Values.namespace .Values.gateway.api.namespace | quote }}
  hostnames: {{ toJson .Values.api_hostnames }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=15724800; includeSubDomains"
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Forwarded, X-Forwarded-Host, X-Forwarded-Port, X-Forwarded-Prefix]
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - group: ""
          kind: Service
          name: brezel
          port: {{ if eq .Values.api_runtime "fpm" }}8080{{ else }}80{{ end }}
          weight: {{ if (eq .Values.rollouts.api.type "canary") }}100{{ else }}1{{ end }}
        {{- if (eq .Values.rollouts.api.type "canary") }}
        - group: ""
          kind: Service
          name: brezel-canary
          port: {{ if eq .Values.api_runtime "fpm" }}8080{{ else }}80{{ end }}
          weight: 0
        {{- end }}
      timeouts:
        request: 0s
        backendRequest: 0s
