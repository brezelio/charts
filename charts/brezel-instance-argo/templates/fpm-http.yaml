{{- if eq .Values.api_runtime "fpm" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: brezel-fpm-http
  namespace: {{ .Values.namespace }}
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      {{- range .Values.fpm_http.trusted_gateway_cidrs }}
      set_real_ip_from {{ . }};
      {{- end }}
      {{- if .Values.fpm_http.trusted_gateway_cidrs }}
      real_ip_header X-Envoy-External-Address;
      {{- end }}
      map $http_x_forwarded_proto $fastcgi_https {
        default "";
        https on;
      }
      map $http_x_forwarded_proto $original_port {
        default 80;
        https 443;
      }
      server {
        listen 8080;
        client_max_body_size {{ .Values.fpm_http.max_body_size }};
        client_body_timeout 1800s;
        # Preserve the existing cluster-edge PHP mitigation until separately retired.
        if ($http_content_type ~* "multipart/form-data") { return 403; }
        location = /healthz {
          access_log off;
          default_type text/plain;
          return 200 "ok\n";
        }
        location / {
          fastcgi_param QUERY_STRING $query_string;
          fastcgi_param REQUEST_METHOD $request_method;
          fastcgi_param CONTENT_TYPE $content_type;
          fastcgi_param CONTENT_LENGTH $content_length;
          fastcgi_param REQUEST_URI $request_uri;
          fastcgi_param DOCUMENT_URI $document_uri;
          fastcgi_param DOCUMENT_ROOT /app/public;
          fastcgi_param SERVER_PROTOCOL $server_protocol;
          fastcgi_param REQUEST_SCHEME $http_x_forwarded_proto;
          fastcgi_param GATEWAY_INTERFACE CGI/1.1;
          fastcgi_param SERVER_SOFTWARE nginx;
          fastcgi_param REMOTE_ADDR $remote_addr;
          fastcgi_param REMOTE_PORT $remote_port;
          fastcgi_param SERVER_ADDR $server_addr;
          fastcgi_param SERVER_PORT $original_port;
          fastcgi_param SERVER_NAME $host;
          fastcgi_param REDIRECT_STATUS 200;
          fastcgi_param SCRIPT_FILENAME /app/public/index.php;
          fastcgi_param SCRIPT_NAME /index.php;
          fastcgi_param HTTP_PROXY "";
          fastcgi_param HTTPS $fastcgi_https if_not_empty;
          fastcgi_pass 127.0.0.1:9000;
          fastcgi_read_timeout 1800s;
          fastcgi_send_timeout 1800s;
          fastcgi_request_buffering off;
          fastcgi_buffering off;
        }
      }
    }
{{- end }}
