apiVersion: v1
kind: Service
metadata:
  name: brezel
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: brezel
  ports:
  - port: 80
    targetPort: {{ if eq .Values.api_runtime "fpm" }}9000{{ else }}80{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: brezel-canary
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: brezel
  ports:
  - port: 80
    targetPort: {{ if eq .Values.api_runtime "fpm" }}9000{{ else }}80{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: brezel-spa
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: brezel-spa
  ports:
  - port: 80
    targetPort: 80
---
{{- if .Values.with_database_pod }}
apiVersion: v1
kind: Service
metadata:
  name: brezel-mysql
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: brezel-mysql
  ports:
  - port: 3306
{{- end }}
---
{{- if .Values.components.phpmyadmin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: phpmyadmin
  ports:
  - port: 80
    targetPort: 80
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: brotcast
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: brotcast
  ports:
  - name: brotcast
    port: {{ .Values.brotcast_server_port }}
    targetPort: {{ .Values.brotcast_server_port }}
