{{- if .Values.components.phpmyadmin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin/phpmyadmin
        imagePullPolicy: Always
        env:
        - name: PMA_HOST
          value: "{{ if .Values.with_database_pod }}{{ include "brezel.mysqlServiceName" . }}{{ else }}{{ .Values.db_host }}{{ end }}"
        - name: PMA_PORT
          value: "{{ if .Values.with_database_pod }}3306{{ else }}{{ .Values.db_port }}{{ end }}"
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "brezel.runtimeSecretName" . }}
              key: MYSQL_PASSWORD
        - name: UPLOAD_LIMIT
          value: "2048M"
        - name: MAX_EXECUTION_TIME
          value: "600"
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: {{ .Values.phpmyadmin_resources.limits.cpu }}
            memory: {{ .Values.phpmyadmin_resources.limits.memory }}
          requests:
            cpu: {{ .Values.phpmyadmin_resources.requests.cpu }}
            memory: {{ .Values.phpmyadmin_resources.requests.memory }}

{{- end }}
